<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PureTouch CRM</title>
<style>
:root{
  --bg:#0d0f1a;
  --bg2:#141726;
  --bg3:#1b1f33;
  --border:#262b42;
  --accent:#6c63ff;
  --accent2:#8a83ff;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#eab308;
  --text:#e8e9f3;
  --text-dim:#9497b0;
  --text-dim2:#6b6e85;
  --radius:12px;
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
body{padding-bottom:70px;}
a{color:var(--accent2);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ===== TOP BAR ===== */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(13,15,26,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:14px 20px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
.tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap;}
.tab{
  background:transparent;border:1px solid transparent;color:var(--text-dim);
  padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:600;
  transition:.15s;
}
.tab:hover{color:var(--text);background:var(--bg3);}
.tab.active{color:#fff;background:var(--accent);}
.top-actions{display:flex;gap:8px;align-items:center;}
.sync-badge{
  font-size:12px;padding:5px 10px;border-radius:8px;background:var(--bg3);
  color:var(--text-dim);white-space:nowrap;transition:.2s;
}
.btn{
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent2);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px;}
.searchbox{
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:8px 12px;border-radius:9px;font-size:13px;min-width:180px;
}

/* ===== CONTAINER ===== */
.container{max-width:1400px;margin:0 auto;padding:18px 20px 40px;}

/* ===== STATS BAR ===== */
.statsbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.stat-chip{
  flex:1;min-width:120px;background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;
}
.stat-chip .num{font-size:24px;font-weight:800;}
.stat-chip .lbl{font-size:12px;color:var(--text-dim);margin-top:2px;}
.stat-chip.ot .num{color:var(--yellow);}
.stat-chip.uz .num{color:var(--green);}
.stat-chip.ko .num{color:var(--red);}
.stat-chip.no .num{color:var(--text-dim);}

/* ===== TABLE ===== */
.table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{
  text-align:left;padding:11px 14px;background:var(--bg3);
  color:var(--text-dim);font-weight:600;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.4px;
  border-bottom:1px solid var(--border);
}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);}
tbody tr{cursor:pointer;transition:.12s;}
tbody tr:hover{background:var(--bg3);}
tbody tr:last-child td{border-bottom:none;}
.badge{
  display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;
  white-space:nowrap;
}
.muted{color:var(--text-dim);}
.empty-state{padding:60px 20px;text-align:center;color:var(--text-dim);}

/* ===== CARDS (mobile) ===== */
.cards{display:flex;flex-direction:column;gap:10px;}
.lead-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;cursor:pointer;
}
.lead-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.lead-card .name{font-weight:700;font-size:15px;}
.lead-card .firma{color:var(--text-dim);font-size:12.5px;margin-top:1px;}
.lead-card .meta{display:flex;gap:10px;margin-top:8px;font-size:12px;color:var(--text-dim2);flex-wrap:wrap;}

/* ===== BOTTOM NAV (mobile) ===== */
.bottom-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:rgba(20,23,38,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
}
.bn-row{display:flex;justify-content:space-around;}
.bn-item{
  background:none;border:none;color:var(--text-dim2);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10px;padding:6px 8px;border-radius:8px;flex:1;
}
.bn-item.active{color:var(--accent2);}
.bn-item .ic{font-size:18px;}

/* ===== PANEL (slide-in) ===== */
.panel-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;
}
.panel-overlay.open{display:block;}
.panel{
  position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100%;
  background:var(--bg2);border-left:1px solid var(--border);z-index:61;
  transform:translateX(100%);transition:transform .22s ease;
  overflow-y:auto;padding:20px;
}
.panel.open{transform:translateX(0);}
.panel h3{margin:0 0 2px;font-size:19px;}
.panel .sub{color:var(--text-dim);font-size:13px;margin-bottom:18px;}
.panel-close{
  position:absolute;top:16px;right:16px;background:var(--bg3);border:1px solid var(--border);
  color:var(--text);width:30px;height:30px;border-radius:8px;font-size:15px;
}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:600;}
.field select,.field input,.field textarea{
  width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:9px 11px;border-radius:8px;font-size:13.5px;
}
.field textarea{min-height:80px;resize:vertical;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.panel-info{
  background:var(--bg3);border-radius:9px;padding:10px 12px;font-size:12.5px;
  color:var(--text-dim);margin-bottom:16px;line-height:1.6;
}
.panel-actions{display:flex;gap:8px;margin-top:18px;}

/* ===== EMAIL TAB ===== */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.kpi-card .n{font-size:26px;font-weight:800;}
.kpi-card .l{font-size:12px;color:var(--text-dim);margin-top:3px;}
.funnel-bar{display:flex;height:34px;border-radius:9px;overflow:hidden;margin-bottom:20px;border:1px solid var(--border);}
.funnel-seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;min-width:2%;}
.cta-banner{
  background:linear-gradient(135deg,var(--accent),#4d44d4);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
}
.cta-banner .txt strong{font-size:15px;}
.cta-banner .txt div{font-size:12.5px;opacity:.9;margin-top:3px;}
.email-section{margin-bottom:22px;}
.email-section h4{font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;margin:0 0 10px;}
.email-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
.email-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;}
.email-card .n{font-weight:700;font-size:13.5px;}
.email-card .f{color:var(--text-dim);font-size:12px;margin-top:1px;}

/* ===== KAMPANE TAB ===== */
.camp-table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;}
.camp-table{width:100%;border-collapse:collapse;font-size:13px;min-width:820px;}
.camp-table th{text-align:left;padding:11px 12px;background:var(--bg3);color:var(--text-dim);font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border);}
.camp-table td{padding:11px 12px;border-bottom:1px solid var(--border);}
.camp-table tr:last-child td{border-bottom:none;}
.roas-good{color:var(--green);font-weight:700;}
.roas-bad{color:var(--red);font-weight:700;}

/* ===== DENNI TAB ===== */
.denni-nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;}
.day-btn{
  background:var(--bg2);border:1px solid var(--border);color:var(--text-dim);
  padding:10px 8px;border-radius:10px;min-width:58px;text-align:center;flex-shrink:0;
  position:relative;
}
.day-btn .wd{font-size:11px;text-transform:uppercase;}
.day-btn .dd{font-size:16px;font-weight:700;margin-top:2px;}
.day-btn .dot{width:5px;height:5px;border-radius:50%;background:var(--accent2);margin:4px auto 0;}
.day-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.denni-item{
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;margin-bottom:8px;
}
.denni-item .who{font-weight:700;font-size:13.5px;}
.denni-item .fi{color:var(--text-dim);font-size:11.5px;}
.denni-item .chg{font-size:13px;margin-top:6px;}
.denni-item .arrow{color:var(--text-dim2);margin:0 6px;}
.denni-item .note{font-size:12.5px;color:var(--text-dim);margin-top:5px;font-style:italic;}

/* ===== STATS TAB ===== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:22px;}
.big-stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.big-stat .n{font-size:30px;font-weight:800;}
.big-stat .l{font-size:12.5px;color:var(--text-dim);margin-top:4px;}
.phase-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.phase-row:last-child{border-bottom:none;}
.phase-row .plabel{flex:0 0 190px;font-size:13px;}
.phase-row .pbar-wrap{flex:1;background:var(--bg3);border-radius:6px;height:10px;overflow:hidden;}
.phase-row .pbar{height:100%;border-radius:6px;}
.phase-row .pcount{flex:0 0 34px;text-align:right;font-weight:700;font-size:13px;}

/* ===== MISC ===== */
.section-title{font-size:15px;font-weight:700;margin:0 0 14px;}
.hidden{display:none !important;}
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--bg3);border:1px solid var(--border);padding:10px 18px;
  border-radius:10px;font-size:13px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.4);
}

/* ===== RESPONSIVE ===== */
@media (max-width:700px){
  .tabs{display:none;}
  .bottom-nav{display:block;}
  .table-wrap{display:none;}
  .searchbox{min-width:0;flex:1;}
  .topbar{padding:12px 14px;gap:10px;}
  .container{padding:14px 14px 30px;}
  .panel{width:100%;}
  .phase-row .plabel{flex:0 0 120px;font-size:12px;}
}
@media (min-width:701px){
  .cards{display:none;}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand"><span class="dot"></span> PureTouch CRM</div>
  <div class="tabs">
    <button class="tab" data-tab="table" onclick="setTab('table')">📋 Leady</button>
    <button class="tab" data-tab="stats" onclick="setTab('stats')">📈 Statistiky</button>
    <button class="tab" data-tab="email" onclick="setTab('email')">📧 Email</button>
    <button class="tab" data-tab="kampane" onclick="setTab('kampane')">📊 Kampaně</button>
    <button class="tab" data-tab="denni" onclick="setTab('denni')">📅 Denní</button>
  </div>
  <input class="searchbox" id="searchInput" placeholder="Hledat jméno, firmu, email…" oninput="onSearch()">
  <div class="top-actions">
    <span class="sync-badge" id="syncBadge">–</span>
    <button class="btn" onclick="syncFromSheet()">⟳ Import ze Sheetu</button>
    <button class="btn btn-primary" onclick="openNewLead()">+ Lead</button>
  </div>
</div>

<div class="container">

  <!-- STATS BAR (nad tabulkou/kartami) -->
  <div class="statsbar" id="statsBar"></div>

  <!-- TABULKA (desktop) -->
  <div class="table-wrap" id="view-table">
    <table>
      <thead>
        <tr>
          <th>Jméno</th><th>Firma</th><th>Email</th><th>Telefon</th>
          <th>Stav</th><th>Followup</th><th>Datum</th><th>Prodej</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- KARTY (mobile) -->
  <div class="cards" id="view-cards"></div>

  <!-- STATISTIKY -->
  <div id="view-stats" style="display:none;"></div>

  <!-- EMAIL -->
  <div id="view-email" style="display:none;"></div>

  <!-- KAMPANĚ -->
  <div id="view-kampane" style="display:none;"></div>

  <!-- DENNÍ -->
  <div id="view-denni" style="display:none;"></div>

</div>

<!-- BOTTOM NAV (mobile) -->
<div class="bottom-nav">
  <div class="bn-row">
    <button class="bn-item" id="bn-table" onclick="setTab('table')"><span class="ic">📋</span>Leady</button>
    <button class="bn-item" id="bn-stats" onclick="setTab('stats')"><span class="ic">📈</span>Stats</button>
    <button class="bn-item" id="bn-email" onclick="setTab('email')"><span class="ic">📧</span>Email</button>
    <button class="bn-item" id="bn-kampane" onclick="setTab('kampane')"><span class="ic">📊</span>Kampaně</button>
    <button class="bn-item" id="bn-denni" onclick="setTab('denni')"><span class="ic">📅</span>Denní</button>
  </div>
</div>

<!-- PANEL (detail leadu) -->
<div class="panel-overlay" id="panelOverlay" onclick="closePanel(event)">
  <div class="panel" id="leadPanel" onclick="event.stopPropagation()">
    <button class="panel-close" onclick="closePanel()">✕</button>
    <h3 id="pName">—</h3>
    <div class="sub" id="pFirma">—</div>
    <div class="panel-info" id="pInfo"></div>

    <div class="field">
      <label>Fáze</label>
      <select id="pStage"></select>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Follow-up</label>
        <input type="date" id="pFollowup">
      </div>
    </div>
    <div class="field">
      <label>Moje poznámky</label>
      <textarea id="pNotes" placeholder="Poznámky, historie komunikace…"></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Částka prodeje (Kč)</label>
        <input type="number" id="pCastka" placeholder="0">
      </div>
      <div class="field">
        <label>Produkt</label>
        <input type="text" id="pProdukt" placeholder="např. AI video balíček">
      </div>
    </div>
    <div class="field">
      <label>Poznámka k prodeji</label>
      <input type="text" id="pProdejNote" placeholder="fakturační údaje, splatnost…">
    </div>

    <div class="panel-actions">
      <button class="btn btn-primary" style="flex:1" onclick="savePanel()">💾 Uložit</button>
      <button class="btn" onclick="closePanel()">Zavřít</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   V&R ADS CRM — jeden HTML soubor, Supabase backend
   ============================================================ */

// ---------- SUPABASE CREDENTIALS (neměnit bez výslovné žádosti) ----------
const SB = 'https://gcrpcrlcaqfbxtjizysb.supabase.co';
const SK = 'sb_publishable_H9DvsObN_UNX5eBXEBza-Q_mEdetygN';
const H  = {'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json'};

const GSHEET_URL = 'REPLACE_WITH_PURETOUCH_GOOGLE_SHEET_CSV_URL';

// ---------- FAZE MODEL ----------
const FAZE = [
  {id:'',                 label:'—',                     poz:'',         cls:'b-none',  color:'#64748b'},
  {id:'volat',             label:'Volat 📞',              poz:'otevreno', cls:'b-volat', color:'#eab308'},
  {id:'nezvedan1',         label:'Nezvedá 1 ☎️',          poz:'otevreno', cls:'b-nez1',  color:'#f59e0b'},
  {id:'nezvedan2',         label:'Nezvedá 2 ☎️',          poz:'otevreno', cls:'b-nez2',  color:'#f97316'},
  {id:'nezvedan3',         label:'Nezvedá 3 ☎️',          poz:'otevreno', cls:'b-nez3',  color:'#ea580c'},
  {id:'odeslat_email',     label:'Odeslat email 📧',      poz:'otevreno', cls:'b-oem',   color:'#38bdf8'},
  {id:'email_odeslano',    label:'Email odeslán 📤',      poz:'otevreno', cls:'b-emo',   color:'#0ea5e9'},
  {id:'email_odpoved',     label:'Email - odpověď 💬',    poz:'otevreno', cls:'b-emr',   color:'#6366f1'},
  {id:'uzavreno_emailem',  label:'Uzavřeno emailem 💚',   poz:'uzavreno', cls:'b-uze',   color:'#22c55e'},
  {id:'komunikace_wa',     label:'Komunikace na WA 💬',   poz:'otevreno', cls:'b-wa',    color:'#25d366'},
  {id:'nerelevantni',      label:'Nerelevantní ☹️',       poz:'konec',    cls:'b-nrl',   color:'#6b7280'},
  {id:'konec',             label:'Konec ❌',              poz:'konec',    cls:'b-end',   color:'#ef4444'},
  {id:'domluvena_schuzka', label:'Domluvena schuzka ✅',  poz:'otevreno', cls:'b-sch',   color:'#a855f7'},
  {id:'odeslana_faktura',  label:'Odeslana faktura 🧾',   poz:'otevreno', cls:'b-fak',   color:'#14b8a6'},
  {id:'uzavreno',          label:'Uzavřeno 💚',           poz:'uzavreno', cls:'b-uz',    color:'#16a34a'},
];
const FAZE_MAP = {};
FAZE.forEach(f => FAZE_MAP[f.id] = f);
function getPoz(stav) { return (FAZE_MAP[stav] || FAZE[0]).poz; }
function getFaze(stav) { return FAZE_MAP[stav] || FAZE[0]; }

// ---------- STATE ----------
let leads = [];          // merged leads + crm_data
let fbSpend = {};         // campaign_name -> spend
let currentTab = 'table';
let currentLead = null;
let searchTerm = '';
let denniBuf = [], denniDay = null, denniLoading = false, denniCounts = {};
const WD = ['Ne','Po','Út','St','Čt','Pá','So'];

function isMobile(){ return window.innerWidth <= 700; }
function mob(){ return isMobile(); }

// ============================================================
// SYNC BADGE
// ============================================================
function showSync(msg, color){
  const b = document.getElementById('syncBadge');
  b.textContent = msg;
  b.style.color = color || 'var(--text-dim)';
}
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

// ============================================================
// LOAD DATA — leads + crm_data merge, fb_spend
// ============================================================
async function loadAll(){
  showSync('⏳ Načítám…', '#d97706');
  try{
    const [leadsRes, crmRes, spendRes] = await Promise.all([
      fetch(SB+'/rest/v1/leads?select=*&order=created_at.desc', {headers:H}),
      fetch(SB+'/rest/v1/crm_data?select=*', {headers:H}),
      fetch(SB+'/rest/v1/fb_spend?select=*', {headers:H}).catch(()=>null)
    ]);
    const leadsData = leadsRes.ok ? await leadsRes.json() : [];
    const crmData   = crmRes.ok ? await crmRes.json() : [];
    const crmMap = {};
    crmData.forEach(c => crmMap[c.email] = c);

    leads = leadsData.map(l => {
      const c = crmMap[l.email] || {};
      return {
        ...l,
        stav: c.stav || '',
        poz: getPoz(c.stav || ''),
        prodej_castka: c.prodej_castka || '',
        prodej_produkt: c.prodej_produkt || '',
        prodej_note: c.prodej_note || '',
        followup: c.followup || '',
        myNotes: c.my_notes || '',
        updated_at: c.updated_at || null,
      };
    });

    fbSpend = {};
    if (spendRes && spendRes.ok){
      const sd = await spendRes.json();
      sd.forEach(s => fbSpend[s.campaign_name] = Number(s.spend) || 0);
    }

    showSync('✅ Synchronizováno', '#16a34a');
  }catch(e){
    showSync('⚠️ Chyba načítání', '#ef4444');
    console.error(e);
  }
  render();
  loadDenniCounts();
}

// ============================================================
// SAVE — saveToApi (PATCH crm_data, INSERT pokud neexistuje)
// ============================================================
async function saveToApi(lead, oldStav, passedOldNotes) {
  showSync('💾 Ukládám…', '#d97706');
  try {
    const idx = leads.findIndex(l => l.email === lead.email);
    const oldNotes = passedOldNotes !== undefined
      ? passedOldNotes
      : (idx >= 0 ? (leads[idx].myNotes || '') : '');
    if (idx >= 0) leads[idx] = {...leads[idx], ...lead};

    const data = {
      stav: lead.stav, poz: lead.poz || getPoz(lead.stav) || null,
      prodej_castka: lead.prodej_castka || null,
      prodej_produkt: lead.prodej_produkt || null,
      prodej_note: lead.prodej_note || null,
      followup: lead.followup || null,
      my_notes: lead.myNotes || null,
      updated_at: new Date().toISOString()
    };
    const enc = encodeURIComponent(lead.email);
    const pr = await fetch(SB+'/rest/v1/crm_data?email=eq.'+enc, {
      method: 'PATCH',
      headers: {...H, 'Prefer': 'return=representation'},
      body: JSON.stringify(data)
    });
    if (!pr.ok) throw new Error(await pr.text());
    const updated = await pr.json();
    if (!updated || updated.length === 0) {
      // Row neexistuje — INSERT
      const ir = await fetch(SB+'/rest/v1/crm_data', {
        method: 'POST',
        headers: {...H, 'Prefer': 'return=minimal'},
        body: JSON.stringify({email: lead.email, ...data})
      });
      if (!ir.ok) throw new Error(await ir.text());
    }
    showSync('✅ Uloženo', '#16a34a');

    // Loguj změnu fáze
    if (oldStav !== undefined && oldStav !== lead.stav)
      await logActivity(lead, 'stav_zmena', {old_stav: oldStav, new_stav: lead.stav});

    // Loguj změnu poznámky (jen diff)
    const newNotes = (lead.myNotes || '').trim();
    const oldN = oldNotes.trim();
    if (newNotes && newNotes !== oldN) {
      let diff = newNotes;
      if (oldN && newNotes.startsWith(oldN)) diff = newNotes.slice(oldN.length).trim();
      else if (oldN && newNotes.endsWith(oldN)) diff = newNotes.slice(0, newNotes.length - oldN.length).trim();
      await logActivity(lead, 'poznamka', {note: diff || newNotes});
    }
  } catch(e) { showSync('⚠️ '+e.message, '#d97706'); }
}

// ============================================================
// LOG ACTIVITY
// ============================================================
async function logActivity(lead, action, opts = {}) {
  try {
    const entry = {
      lead_email: lead.email,
      lead_name:  lead.jmeno  || '',
      lead_firma: lead.firma  || '',
      action,
      old_stav: opts.old_stav || '',
      new_stav: opts.new_stav || '',
      note:     opts.note     || null
    };
    await fetch(SB+'/rest/v1/activity_log', {
      method: 'POST',
      headers: {...H, 'Prefer': 'return=minimal'},
      body: JSON.stringify(entry)
    });
  } catch(e) { /* tiché logování */ }
}

function setTab(t) {
  currentTab = t;
  document.querySelectorAll('.tab').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === t));
  ['table','stats','email','kampane','denni'].forEach(id => {

    if (el) el.classList.toggle('active', id === t);
  });

  document.getElementById('view-cards').style.display   = (t==='table' &&  mob()) ? 'block' : 'none';

  document.getElementById('view-email').style.display   = t==='email'   ? 'block' : 'none';
  document.getElementById('view-kampane').style.display = t==='kampane' ? 'block' : 'none';

function onSearch(){
  searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();

}

function getFiltered(){
  if (!searchTerm) return leads;
  return leads.filter(l =>
    (l.jmeno||'').toLowerCase().includes(searchTerm) ||
    (l.firma||'').toLowerCase().includes(searchTerm) ||
    (l.email||'').toLowerCase().includes(searchTerm)
  );
}

function fmtDate(d){
  if (!d) return '–';
  try{
    const dt = new Date(d);
    if (isNaN(dt)) return esc(String(d));
    return dt.toLocaleDateString('cs-CZ');
  }catch(e){ return esc(String(d)); }
}
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s).replace(/'/g, '&#39;'); }

function buildStageOptions(selected){
  return FAZE.map(f => `<option value="${f.id}" ${f.id===selected?'selected':''}>${f.label}</option>`).join('');
}

function openLeadPanel(email){
  const lead = leads.find(l => l.email === email);
  if (!lead) return;
  currentLead = lead;
  document.getElementById('pName').textContent = lead.jmeno || lead.email;
  document.getElementById('pFirma').textContent = lead.firma || '—';
  document.getElementById('pInfo').innerHTML = `
    ✉️ ${esc(lead.email)}<br>
    📞 ${esc(lead.telefon)||'neuvedeno'}<br>
    🎯 Zdroj: ${esc(lead.zdroj)||'neuvedeno'} · Služba: ${esc(lead.sluzba)||'neuvedeno'}<br>
    📅 Vytvořeno: ${fmtDate(lead.datum || lead.created_at)}
  `;
  document.getElementById('pStage').innerHTML = buildStageOptions(lead.stav);
  document.getElementById('pFollowup').value = lead.followup || '';
  document.getElementById('pNotes').value = lead.myNotes || '';
  document.getElementById('pCastka').value = lead.prodej_castka || '';
  document.getElementById('pProdukt').value = lead.prodej_produkt || '';
  document.getElementById('pProdejNote').value = lead.prodej_note || '';

  document.getElementById('panelOverlay').classList.add('open');
  document.getElementById('leadPanel').classList.add('open');

function closePanel(e){
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('panelOverlay').classList.remove('open');
  document.getElementById('leadPanel').classList.remove('open');
  currentLead = null;
}

function openNewLead(){
  const email = prompt('E-mail nového leadu:');
  if (!email) return;
  const jmeno = prompt('Jméno:') || '';
  const firma = prompt('Firma:') || '';
  const telefon = prompt('Telefon:') || '';
  createLead({email, jmeno, firma, telefon});
}

async function createLead(l){
  showSync('💾 Vytvářím…', '#d97706');
  try{
    const body = {
      email: l.email, jmeno: l.jmeno||'', firma: l.firma||'',
      telefon: l.telefon||'', datum: new Date().toISOString().slice(0,10),
      zdroj: l.zdroj || 'ruční přidání', sluzba: l.sluzba||'', problem: l.problem||''
    };
    const r = await fetch(SB+'/rest/v1/leads', {
      method:'POST', headers:{...H,'Prefer':'return=representation'}, body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error(await r.text());
    showSync('✅ Přidáno', '#16a34a');
    await loadAll();
  }catch(e){ showSync('⚠️ '+e.message, '#ef4444'); }
}

// savePanel — zachytit oldNotes PŘED mutací (kritická oprava)
function savePanel() {
  if (!currentLead) return;
  const oldStav  = currentLead.stav;
  const oldNotes = currentLead.myNotes || ''; // ← MUSÍ BÝT PŘED přepsáním!
  currentLead.stav           = document.getElementById('pStage').value;
  currentLead.followup       = document.getElementById('pFollowup').value;
  currentLead.myNotes        = document.getElementById('pNotes').value;
  currentLead.prodej_castka  = document.getElementById('pCastka').value;
  currentLead.prodej_produkt = document.getElementById('pProdukt').value;
  currentLead.prodej_note    = document.getElementById('pProdejNote').value;
  currentLead.poz            = getPoz(currentLead.stav); // poz se odvozuje ze stav

  saveToApi(currentLead, oldStav, oldNotes);
  renderStatsBar();
  if (currentTab === 'table') { if (isMobile()) renderCards(); else renderTable(); }
  closePanel();
}

// ============================================================
// ZÁLOŽKA: EMAIL
// ============================================================
const EMAIL_PHASES = ['odeslat_email','email_odeslano','email_odpoved','uzavreno_emailem'];
const EMAIL_LABELS = {odeslat_email:'Čeká na email', email_odeslano:'Odesláno', email_odpoved:'Odpověděli', uzavreno_emailem:'Uzavřeno'};

function renderEmail(){
  const groups = {};
  EMAIL_PHASES.forEach(p => groups[p] = leads.filter(l => l.stav === p));
  const totalInFunnel = EMAIL_PHASES.reduce((s,p)=>s+groups[p].length,0);
  const closedCount = groups['uzavreno_emailem'].length;
  const convRate = totalInFunnel ? (closedCount/totalInFunnel*100).toFixed(1) : '0.0';

  const kpiHtml = EMAIL_PHASES.map(p => `
    <div class="kpi-card">
      <div class="n" style="color:${FAZE_MAP[p].color}">${groups[p].length}</div>
      <div class="l">${EMAIL_LABELS[p]}</div>
    </div>
  `).join('') + `
    <div class="kpi-card">
      <div class="n" style="color:var(--green)">${convRate}%</div>
      <div class="l">Konverze emailem</div>
    </div>
  `;

  const funnelHtml = totalInFunnel ? EMAIL_PHASES.map(p => {
    const pct = (groups[p].length/totalInFunnel*100);
    if (pct <= 0) return '';
    return `<div class="funnel-seg" style="width:${pct}%;background:${FAZE_MAP[p].color}" title="${EMAIL_LABELS[p]}: ${groups[p].length}">${pct>=8?groups[p].length:''}</div>`;
  }).join('') : `<div class="funnel-seg" style="width:100%;background:var(--bg3);color:var(--text-dim)">Zatím žádná data</div>`;

  const waitingCount = groups['odeslat_email'].length;
  const ctaHtml = waitingCount > 0 ? `
    <div class="cta-banner">
      <div class="txt">
        <strong>${waitingCount} ${waitingCount===1?'lead čeká':'leadů čeká'} na email draft</strong>
        <div>Napiš mi "zpracuj emaily" a vytvořím Gmail drafty (skill vrads-lead-email-drafts).</div>
      </div>
      <button class="btn btn-primary" onclick="showToast('Napiš do chatu: \\'zpracuj emaily\\' — Claude vytvoří Gmail drafty')">✉️ Zpracovat emaily</button>
    </div>
  ` : '';

  function cardsFor(list){
    if (!list.length) return `<div class="muted" style="font-size:13px;">Žádní leadi v této fázi.</div>`;
    return `<div class="email-cards">` + list.map(l => `
      <div class="email-card" onclick="openLeadPanel('${escAttr(l.email)}')">
        <div class="n">${esc(l.jmeno)||esc(l.email)}</div>
        <div class="f">${esc(l.firma)||''}</div>
      </div>
    `).join('') + `</div>`;
  }

  document.getElementById('view-email').innerHTML = `
    <div class="kpi-grid">${kpiHtml}</div>
    <div class="funnel-bar">${funnelHtml}</div>
    ${ctaHtml}
    <div class="email-section"><h4>Čeká na odeslání</h4>${cardsFor(groups['odeslat_email'])}</div>
    <div class="email-section"><h4>Odesláno</h4>${cardsFor(groups['email_odeslano'])}</div>
    <div class="email-section"><h4>Odpověděli</h4>${cardsFor(groups['email_odpoved'])}</div>
    <div class="email-section"><h4>Uzavřeno emailem</h4>${cardsFor(groups['uzavreno_emailem'])}</div>
  `;
}

// ============================================================
// ZÁLOŽKA: KAMPANĚ
// ============================================================
function renderKampane(){
  const groups = {};
  leads.forEach(l => {
    const key = l.campaign_name || l.ad_name || 'Neuvedeno';
    if (!groups[key]) groups[key] = [];
    groups[key].push(l);
  });

  const rows = Object.keys(groups).map(name => {
    const list = groups[name];
    const leadCount = list.length;
    const sales = list.filter(l => Number(l.prodej_castka) > 0);
    const revenue = list.reduce((s,l)=>s+(Number(l.prodej_castka)||0),0);
    const conv = leadCount ? (sales.length/leadCount*100).toFixed(1) : '0.0';
    const spend = fbSpend[name] || 0;
    const cpl = (spend && leadCount) ? (spend/leadCount) : 0;
    const roas = (spend > 0) ? (revenue/spend) : 0;
    return {name, leadCount, salesCount: sales.length, conv, revenue, spend, cpl, roas};
  }).sort((a,b) => b.leadCount - a.leadCount);

  if (!rows.length){
    document.getElementById('view-kampane').innerHTML = `<div class="empty-state">Zatím žádné kampaně / kreativy k zobrazení.</div>`;
    return;
  }

  document.getElementById('view-kampane').innerHTML = `
    <div class="camp-table-wrap">
      <table class="camp-table">
        <thead><tr>
          <th>Kreativa / kampaň</th><th>Leady</th><th>Prodeje</th><th>Konverze</th>
          <th>Obrat</th><th>FB Spend</th><th>CPL</th><th>ROAS</th><th></th>
        </tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td>${esc(r.name)}</td>
              <td>${r.leadCount}</td>
              <td>${r.salesCount}</td>
              <td>${r.conv}%</td>
              <td>${r.revenue.toLocaleString('cs-CZ')} Kč</td>
              <td>${r.spend ? r.spend.toLocaleString('cs-CZ')+' Kč' : '<span class="muted">–</span>'}</td>
              <td>${r.cpl ? r.cpl.toFixed(0)+' Kč' : '<span class="muted">–</span>'}</td>
              <td class="${r.roas>=3?'roas-good':(r.roas>0?'roas-bad':'')}">${r.roas ? r.roas.toFixed(2)+'x' : '<span class="muted">–</span>'}</td>
              <td><button class="btn btn-sm" onclick="editFbSpend('${escAttr(r.name)}')">✏️</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

async function editFbSpend(campName){
  const cur = fbSpend[campName] || 0;
  const val = prompt('FB výdaje pro:\n' + campName, cur);
  if (val === null) return;
  const spend = Number(val.replace(',', '.')) || 0;
  try{
    const r = await fetch(SB+'/rest/v1/fb_spend', {
      method: 'POST',
      headers: {...H, 'Prefer': 'resolution=merge-duplicates,return=minimal'},
      body: JSON.stringify({campaign_name: campName, spend})
    });
    if (!r.ok) throw new Error(await r.text());
    fbSpend[campName] = spend;
    showToast('FB výdaje uloženy');
    renderKampane();
  }catch(e){ showToast('Chyba ukládání: '+e.message); }
}

// ============================================================
// ZÁLOŽKA: DENNÍ
// ============================================================
function last7Days(){
  const arr = [];
  for (let i=6; i>=0; i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    arr.push(d.toISOString().slice(0,10));
  }
  return arr;
}

async function loadDenniCounts(){
  denniCounts = {};
  const days = last7Days();
  try{
    const from = days[0];
    const r = await fetch(SB+'/rest/v1/activity_log?select=date&date=gte.'+from, {headers:H});
    if (r.ok){
      const rows = await r.json();
      rows.forEach(row => {
        const d = (row.date || '').slice(0,10);
        denniCounts[d] = (denniCounts[d]||0) + 1;
      });
    }
  }catch(e){ /* tiché */ }
  if (currentTab === 'denni') renderDenni();
}

function renderDenni(){
  const days = last7Days();
  if (!denniDay) denniDay = days[days.length-1];

  const nav = days.map(d => {
    const dt = new Date(d+'T12:00:00');
    const wd = WD[dt.getDay()];
    const dd = dt.getDate();
    const count = denniCounts[d] || 0;
    return `<button class="day-btn ${d===denniDay?'active':''}" data-day="${d}" onclick="switchDenniDay('${d}')">
      <div class="wd">${wd}</div><div class="dd">${dd}</div>
      ${count>0 ? '<div class="dot"></div>' : ''}
    </button>`;
  }).join('');

  document.getElementById('view-denni').innerHTML = `
    <div class="denni-nav" id="denni-nav">${nav}</div>
    <div id="denni-content"><div class="muted" style="padding:20px 0;">Načítám…</div></div>
  `;
  switchDenniDay(denniDay);
}

// Přepne den — aktualizuje třídu active na tlačítkách BEZ přestavění celého nav HTML
async function switchDenniDay(day){
  document.querySelectorAll('#denni-nav .day-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.day === day);
  });
  denniDay = day;
  denniLoading = true;
  const content = document.getElementById('denni-content');
  content.innerHTML = `<div class="muted" style="padding:20px 0;">Načítám…</div>`;
  try{
    const r = await fetch(SB+'/rest/v1/activity_log?select=*&date=eq.'+day+'&order=created_at.desc', {headers:H});
    const rows = r.ok ? await r.json() : [];
    denniBuf = rows;
    renderDenniContent(rows);
  }catch(e){
    content.innerHTML = `<div class="empty-state">Chyba načítání aktivit.</div>`;
  }
  denniLoading = false;
}

// Renderuje obsah dne
function renderDenniContent(rows){
  const content = document.getElementById('denni-content');
  if (!rows.length){
    content.innerHTML = `<div class="empty-state">Tento den nemá zaznamenanou žádnou aktivitu.</div>`;
    return;
  }
  content.innerHTML = rows.map(row => {
    const time = row.created_at ? new Date(row.created_at).toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'}) : '';
    if (row.action === 'stav_zmena'){
      const oldF = getFaze(row.old_stav);
      const newF = getFaze(row.new_stav);
      let lastNote = '';
      if (row.note){
        lastNote = row.note.includes(',') ? row.note.split(',').pop().trim() : row.note;
      }
      return `<div class="denni-item">
        <div class="who">${esc(row.lead_name)||esc(row.lead_email)} <span class="muted" style="font-weight:400;">${time}</span></div>
        <div class="fi">${esc(row.lead_firma)||''}</div>
        <div class="chg">
          <span class="badge" style="background:${oldF.color}22;color:${oldF.color}">${oldF.label||'—'}</span>
          <span class="arrow">→</span>
          <span class="badge" style="background:${newF.color}22;color:${newF.color}">${newF.label||'—'}</span>
        </div>
        ${lastNote ? `<div class="note">💬 ${esc(lastNote)}</div>` : ''}
      </div>`;
    } else {
      return `<div class="denni-item">
        <div class="who">${esc(row.lead_name)||esc(row.lead_email)} <span class="muted" style="font-weight:400;">${time}</span></div>
        <div class="fi">${esc(row.lead_firma)||''}</div>
        <div class="note">📝 ${esc(row.note)}</div>
      </div>`;
    }
  }).join('');
}

// ============================================================
// IMPORT Z GOOGLE SHEETS
// ============================================================
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i=0; i<text.length; i++){
    const c = text[i], next = text[i+1];
    if (inQuotes){
      if (c === '"' && next === '"'){ field += '"'; i++; }
      else if (c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field=''; }
      else if (c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if (c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length && r.some(x=>x.trim()!==''));
}

function normalizeHeader(h){
  return h.trim().toLowerCase()
    .replace(/á/g,'a').replace(/č/g,'c').replace(/ď/g,'d').replace(/é/g,'e')
    .replace(/ě/g,'e').replace(/í/g,'i').replace(/ň/g,'n').replace(/ó/g,'o')
    .replace(/ř/g,'r').replace(/š/g,'s').replace(/ť/g,'t').replace(/ú/g,'u')
    .replace(/ů/g,'u').replace(/ý/g,'y').replace(/ž/g,'z');
}

const HEADER_MAP = {
  'jmeno':'jmeno', 'jmeno a prijmeni':'jmeno', 'name':'jmeno',
  'firma':'firma', 'company':'firma',
  'email':'email', 'e-mail':'email',
  'telefon':'telefon', 'phone':'telefon',
  'zajem':'sluzba', 'sluzba':'sluzba', 'service':'sluzba',
  'kampan':'campaign_name', 'campaign':'campaign_name', 'campaign_name':'campaign_name',
  'kreativa':'ad_name', 'ad':'ad_name', 'ad_name':'ad_name',
  'datum':'datum', 'date':'datum',
  'platforma':'platform', 'platform':'platform',
  'problem':'problem'
};

async function syncFromSheet(){
  showSync('⏳ Stahuji ze Sheetu…', '#d97706');
  try{
    const res = await fetch(GSHEET_URL);
    if (!res.ok) throw new Error('Nepodařilo se stáhnout Google Sheet');
    const text = await res.text();
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error('Sheet je prázdný');

    const headers = rows[0].map(h => HEADER_MAP[normalizeHeader(h)] || normalizeHeader(h).replace(/\s+/g,'_'));
    const dataRows = rows.slice(1);

    let inserted = 0, updated = 0, skipped = 0;
    for (const r of dataRows){
      const obj = {};
      headers.forEach((h,i) => obj[h] = (r[i]||'').trim());
      if (!obj.email){ skipped++; continue; }

      const exists = leads.find(l => l.email === obj.email);
      const body = {
        email: obj.email, jmeno: obj.jmeno||'', firma: obj.firma||'',
        telefon: obj.telefon||'', datum: obj.datum || new Date().toISOString().slice(0,10),
        zdroj: 'Google Sheet', sluzba: obj.sluzba||'', problem: obj.problem||''
      };
      if (exists){
        const r2 = await fetch(SB+'/rest/v1/leads?email=eq.'+encodeURIComponent(obj.email), {
          method:'PATCH', headers:{...H,'Prefer':'return=minimal'}, body: JSON.stringify(body)
        });
        if (r2.ok) updated++; else skipped++;
      } else {
        const r2 = await fetch(SB+'/rest/v1/leads', {
          method:'POST', headers:{...H,'Prefer':'return=minimal'}, body: JSON.stringify(body)
        });
        if (r2.ok) inserted++; else skipped++;
      }
    }
    showSync('✅ Import hotov', '#16a34a');
    showToast(`Import: ${inserted} nových, ${updated} aktualizováno, ${skipped} přeskočeno`);
    await loadAll();
  }catch(e){
    showSync('⚠️ Chyba importu', '#ef4444');
    showToast('Chyba importu: ' + e.message);
  }
}
